<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck horizontal</title><style>
html{font-size:calc(100vw/160)} body{margin:0;background:#0d1b2a;color:#f1f1f1;font-family:system-ui}
#deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100vh}
#deck>section{flex:0 0 100vw;height:100vh;box-sizing:border-box;padding:10vh 8rem;scroll-snap-align:start;position:relative}
h2{font-size:6rem;margin:0}
</style></head><body><main id="deck">
<section id="h1"><h2>Horizontal 1</h2><p>Page une</p></section><section id="h2"><h2>Horizontal 2</h2></section><section id="h3"><h2>Horizontal 3</h2></section><section id="h4"><h2>Horizontal 4</h2></section>
</main></body></html>
